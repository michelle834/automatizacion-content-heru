<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centro de operaciones heru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;700&display=swap">
<style>
/* Mismo lenguaje del Content Dash: sidebar con emoji, pastillas de red arriba,
   tarjetas con borde de estado (gris idea · ámbar en proceso · verde listo · azul publicado). */
:root{
  --cream:#F5EFE3; --grid:#EEE9DF; --azul:#1790EC; --cian:#15D1FE;
  --negro:#111; --gris:#7C7468; --gris2:#B3ABA0; --blanco:#fff; --linea:#E6E0D4;
  --verde:#16A34A; --ambar:#D97706; --rojo:#DC2626;
  --titulo:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --cuerpo:'Lexend Deca','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--negro);font-family:var(--cuerpo);font-size:14px;line-height:1.55;
  font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
a{color:var(--azul)}

.app{display:grid;grid-template-columns:232px 1fr;gap:0;min-height:100vh;max-width:1400px;margin:0 auto}

/* sidebar */
.lado{background:var(--blanco);border-right:1px solid var(--linea);padding:18px 0 40px;
  position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto}
.marca{padding:0 18px 16px;display:flex;align-items:baseline;gap:8px}
.marca .logo{font-family:var(--titulo);font-weight:700;font-size:23px;color:var(--azul);letter-spacing:-.03em}
.marca .txt{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gris2)}
.nav{display:flex;flex-direction:column}
.nav button{background:transparent;border:none;text-align:left;padding:9px 18px;font-size:14px;
  color:var(--negro);display:flex;align-items:center;gap:9px;border-left:3px solid transparent}
.nav button:hover{background:var(--cream)}
.nav button[aria-current="true"]{background:var(--cream);border-left-color:var(--azul);font-weight:500}
.nav .cuenta{margin-left:auto;font-size:11px;color:var(--blanco);background:var(--azul);
  border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.nav .cuenta.apagada{background:var(--linea);color:var(--gris)}
.leyenda{margin:22px 18px 0;padding-top:16px;border-top:1px solid var(--linea);font-size:11.5px;color:var(--gris);line-height:1.9}
.leyenda b{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gris2);margin-bottom:6px}
.leyenda i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;font-style:normal}
.i-gris{background:var(--gris2)} .i-ambar{background:var(--ambar)}
.i-verde{background:var(--verde)} .i-azul{background:var(--azul)}

/* contenido */
.main{padding:22px 26px 70px;min-width:0}
.cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
h1{font-family:var(--titulo);font-weight:700;font-size:24px;letter-spacing:-.02em;margin:0}
.conex{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--gris)}
.pt{width:8px;height:8px;border-radius:50%;background:var(--gris2)} .pt.vivo{background:var(--verde)}
.dice{color:var(--gris);font-size:14px;margin:0 0 18px;max-width:74ch}

.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.pill{background:var(--blanco);border:1px solid var(--linea);border-radius:999px;padding:5px 13px;font-size:13px;color:var(--gris)}
.pill[aria-pressed="true"]{background:var(--negro);border-color:var(--negro);color:#fff}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:24px}
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:10px;padding:13px 14px}
.card .n{font-family:var(--titulo);font-weight:700;font-size:28px;line-height:1;display:block}
.card .l{font-size:11.5px;color:var(--gris);margin-top:6px;display:block;line-height:1.35}
.card.v .n{color:var(--verde)} .card.a .n{color:var(--ambar)} .card.r .n{color:var(--rojo)}

h2{font-family:var(--titulo);font-weight:700;font-size:16px;margin:26px 0 4px}
.h2n{color:var(--gris);font-weight:400;font-family:var(--cuerpo);font-size:13px}
.h2sub{color:var(--gris);font-size:13px;margin:0 0 14px}

/* pieza */
.pieza{background:var(--blanco);border:1px solid var(--linea);border-left:5px solid var(--gris2);
  border-radius:10px;margin-bottom:12px;overflow:hidden}
.pieza.e-verde{border-left-color:var(--verde)}
.pieza.e-ambar{border-left-color:var(--ambar)}
.pieza.e-azul{border-left-color:var(--azul)}
.p-top{padding:13px 16px;display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.p-top .izq{flex:1;min-width:200px}
.p-top .tema{font-size:16px;font-weight:500;margin:0 0 4px;line-height:1.3}
.p-top .kw{font-size:12.5px;color:var(--gris);margin:0}
.p-top .der{text-align:right;white-space:nowrap}
.p-top .pts{font-family:var(--titulo);font-weight:700;font-size:22px;display:block;line-height:1}
.p-top .pts small{font-size:11px;color:var(--gris2);font-weight:400}
.tags{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
.tag{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--cream);color:var(--gris)}
.tag.red{background:#EAF4FE;color:#0B5FA5}
.tag.cuando{background:#EAF4FE;color:#0B5FA5}
.estado-linea{padding:9px 16px;font-size:13px;border-top:1px solid var(--linea);background:#FBF9F5}
.estado-linea b{font-weight:500}
.estado-linea.ok{color:var(--verde)} .estado-linea.esp{color:var(--ambar)}

details{border-top:1px solid var(--linea)}
summary{padding:10px 16px;font-size:13px;color:var(--azul);cursor:pointer;list-style:none;font-weight:500}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸ ';color:var(--gris2)}
details[open] summary::before{content:'▾ '}
.det{padding:4px 16px 16px}
.seccion{padding:14px 0;border-top:1px dashed var(--linea)}
.seccion:first-child{border-top:none;padding-top:6px}
.seccion h3{font-family:var(--titulo);font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--gris2);margin:0 0 9px}
.par{display:grid;grid-template-columns:132px 1fr;gap:5px 14px;font-size:13.5px;margin:0}
.par dt{color:var(--gris);font-size:12.5px} .par dd{margin:0}
.puntos-lista{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--gris);margin:0 0 9px}
.puntos-lista b{color:var(--negro);font-weight:500}
.caption{background:var(--cream);border-radius:8px;padding:13px 14px;white-space:pre-wrap;font-size:14px;line-height:1.6;margin:0 0 9px}
.caption .cierre{display:block;margin-top:12px;font-weight:500}
.compuerta{display:flex;gap:10px;padding:8px 0;font-size:13px;align-items:flex-start}
.compuerta .marca-v{width:16px;flex:0 0 auto;font-weight:700}
.v-pasa{color:var(--verde)} .v-no{color:var(--rojo)} .v-pend{color:var(--ambar)}
.compuerta .qn{font-size:11.5px;color:var(--gris2)}
.compuerta .nt{color:var(--gris);font-size:12.5px;margin-top:2px}
.arte{border:1px dashed var(--gris2);border-radius:8px;padding:12px;background:#FBF9F5}
.arte.puesto{border-style:solid;border-color:var(--verde);background:#F4FBF6}
.arte input{width:100%;margin-top:7px;font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--linea);border-radius:6px;background:#fff}
.acc{padding:14px 16px;border-top:1px solid var(--linea);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.acc.listo{background:#F4FBF6}
.acc p{margin:0;font-size:13px;color:var(--gris);flex:1;min-width:180px}
.btn{background:var(--azul);color:#fff;border:none;border-radius:999px;padding:8px 18px;font-weight:500;font-size:13.5px}
.btn:hover:not(:disabled){filter:brightness(.93)}
.btn:disabled{background:var(--linea);color:var(--gris2);cursor:not-allowed}
.btn.verde{background:var(--verde)} .btn.ghost{background:transparent;color:var(--negro);border:1px solid var(--linea)}
.btn.chico{padding:5px 13px;font-size:12.5px}
.btn:focus-visible,summary:focus-visible,.pill:focus-visible,.nav button:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

.tabla-wrap{overflow-x:auto;background:var(--blanco);border:1px solid var(--linea);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
th{background:#FBF9F5;color:var(--gris);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  text-align:left;padding:9px 11px;border-bottom:1px solid var(--linea);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--linea)}
tr:last-child td{border-bottom:none}
td.num{text-align:right;white-space:nowrap}
td.tot{text-align:right;font-weight:700;font-family:var(--titulo)}
tr.bloq td:first-child{border-left:3px solid var(--rojo)}
.vacio{background:var(--blanco);border:1px dashed var(--gris2);border-radius:10px;padding:26px 20px;text-align:center;color:var(--gris)}
.vacio strong{display:block;font-family:var(--titulo);font-size:15px;color:var(--negro);margin-bottom:6px}
.conf{background:var(--blanco);border:1px solid var(--linea);border-radius:10px;padding:16px;max-width:620px}
.conf label{display:block;font-size:12.5px;font-weight:500;margin:12px 0 4px}
.conf input{width:100%;font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--linea);border-radius:6px;background:#FBF9F5}
.pie{font-size:12px;color:var(--gris);margin-top:12px;line-height:1.5}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--cream);padding:1px 5px;border-radius:3px}

/* investigación */
.busca{margin-bottom:18px}
.busca input{width:100%;max-width:520px;font:inherit;font-size:14px;padding:10px 14px;
  border:1px solid var(--linea);border-radius:999px;background:var(--blanco)}
.busca input:focus{outline:2px solid var(--azul);outline-offset:1px}
.docs{display:grid;gap:8px}
.doc{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;
  background:var(--blanco);border:1px solid var(--linea);border-radius:10px;padding:13px 16px}
.doc:hover{border-color:var(--azul)}
.doc .nm{font-family:var(--titulo);font-weight:700;font-size:13px;color:var(--gris2);
  flex:0 0 26px;padding-top:2px}
.doc .ti{display:block;font-size:15px;font-weight:500;margin-bottom:3px}
.doc .re{display:block;font-size:12.5px;color:var(--gris);line-height:1.45}
.hit{background:var(--blanco);border:1px solid var(--linea);border-radius:10px;padding:13px 16px;margin-bottom:8px}
.hit .lnk{background:none;border:none;color:var(--azul);font-size:14.5px;font-weight:500;padding:0}
.hit .cnt{font-size:11px;color:var(--gris);background:var(--cream);border-radius:999px;padding:1px 8px;margin-left:8px}
.frag{font-size:12.5px;color:var(--gris);margin:7px 0 0;line-height:1.5}
mark{background:var(--cian);color:var(--negro);padding:0 2px}

/* parrilla semanal */
.sem td:first-child{white-space:nowrap}
.sem .dia{display:block;font-weight:600}
.sem .tem{display:block;font-size:12px;color:var(--gris);margin-top:1px}
.sem .off{color:var(--gris2)}
.sem .pil{display:inline-block;margin-top:5px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--gris);background:var(--cream);border:1px solid var(--linea);border-radius:999px;padding:1px 8px;
  white-space:nowrap}
.sem strong{font-weight:600}
h2.sec{font-family:var(--titulo);font-size:17px;margin:30px 0 4px}
p.sub{font-size:13.5px;color:var(--gris);line-height:1.55;margin:0 0 14px;max-width:72ch}
.redes{display:grid;gap:9px;margin:0 0 6px}
.redc{background:var(--blanco);border:1px solid var(--linea);border-radius:10px;padding:14px 16px}
.redc h3{font-family:var(--titulo);font-size:15px;margin:0}
.redc .sn{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--gris);background:var(--cream);border-radius:999px;padding:2px 9px;margin:6px 0 9px}
.redc p{margin:0;font-size:13.5px;line-height:1.6}
.redc .dias{margin-top:9px;font-size:12.5px;color:var(--gris);border-top:1px solid var(--linea);padding-top:9px}
.nota{background:var(--blanco);border:1px solid var(--linea);border-left:3px solid var(--cian);
  border-radius:8px;padding:13px 16px;font-size:13.5px;line-height:1.6;margin:0 0 6px;max-width:72ch}

/* lector: medida corta, que es lo que hace legible un texto largo */
.lee{max-width:72ch;font-size:15px;line-height:1.7}
.lee h2{font-size:21px;margin:30px 0 10px}
.lee h3{font-family:var(--titulo);font-weight:700;font-size:17px;margin:24px 0 8px}
.lee h4,.lee h5{font-family:var(--titulo);font-weight:700;font-size:14px;margin:20px 0 6px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--gris)}
.lee p{margin:0 0 13px}
.lee ul,.lee ol{margin:0 0 13px;padding-left:22px}
.lee li{margin-bottom:5px}
.lee blockquote{margin:0 0 13px;padding:2px 0 2px 16px;border-left:3px solid var(--cian);color:var(--gris)}
.lee hr{border:none;border-top:1px solid var(--linea);margin:26px 0}
.lee pre{background:var(--blanco);border:1px solid var(--linea);border-radius:8px;
  padding:13px 15px;overflow-x:auto;margin:0 0 13px}
.lee pre code{background:none;padding:0;font-size:12.5px;line-height:1.5}
.lee .tabla-wrap{margin:0 0 16px;max-width:none}
.lee table{min-width:0}
.lee td{vertical-align:top}
.lee strong{font-weight:600}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .lado{position:static;height:auto;border-right:none;border-bottom:1px solid var(--linea);padding-bottom:14px}
  .nav{flex-direction:row;overflow-x:auto;padding:0 12px}
  .nav button{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;padding:8px 12px}
  .nav button[aria-current="true"]{border-left-color:transparent;border-bottom-color:var(--azul)}
  .leyenda{display:none}
  .main{padding:18px 16px 60px}
  .par{grid-template-columns:1fr;gap:2px 0}
  .par dt{margin-top:8px}
}
</style>
</head>
<body>
<div class="app">

  <aside class="lado">
    <div class="marca"><span class="logo">heru</span><span class="txt">operaciones</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="leyenda">
      <b>Cómo leer el borde</b>
      <div><i class="i-gris"></i>idea, en el pool</div>
      <div><i class="i-ambar"></i>en proceso, con los agentes</div>
      <div><i class="i-verde"></i>lista, te toca aprobar</div>
      <div><i class="i-azul"></i>aprobada y programada</div>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<script>
const REDES=['TikTok','Instagram','Facebook','YouTube','LinkedIn'];
const SECCIONES=[
  {k:'aprobar',    e:'✅', t:'Por aprobar'},
  {k:'programado', e:'🗓️', t:'Programado'},
  {k:'proceso',    e:'🧪', t:'Con los agentes'},
  {k:'grabacion',  e:'🎬', t:'Cola de grabación'},
  {k:'ideas',      e:'💡', t:'Ideas en el pool'},
  {k:'aprendizajes',e:'📊', t:'Aprendizajes'},
  {k:'parrilla',   e:'📅', t:'Parrilla semanal'},
  {k:'investigacion',e:'📚', t:'Investigación'},
  {k:'conexion',   e:'⚙️', t:'Conexión'}
];

/* Las secciones del mastermind. Viven como .md en el repo, al lado
   de esta página, así que se leen del mismo origen sin depender de nada.
   El título y el resumen van aquí para que la lista pinte al instante:
   el documento completo se baja solo cuando lo abres. */
const DOCS=[
 ['00-indice','Índice','El mapa completo: qué contesta cada sección y en qué orden leerlas.'],
 ['01-algoritmos','Cómo funcionan los algoritmos','Lo que las propias plataformas documentaron en 2026: originalidad con sanción, frescura del mismo día, y qué penaliza cada red.'],
 ['02-que-impulsar','Qué impulsar en cada red','Un agente por red. La conclusión compartida: heru sobreproduce piezas cortas y parecidas en todos lados.'],
 ['03-manual-de-ejecucion','Manual de ejecución por red','Formato, duración, cadencia, tono, estructura de post y banco de hooks. Para producir sin volver a preguntar.'],
 ['04-competencia','Competencia y qué se viraliza','Los dos tipos de contenido fiscal que conviven en TikTok, y cuál gana.'],
 ['05-estructura-y-hooks','Estructura de contenido por red','Cómo se arma un post que funcione en cada plataforma, con ejemplos.'],
 ['06-sistema-de-ideas','Sistema de ideas','El banco de 120 ideas de Alan Villagrán, adaptado a heru.'],
 ['07-prefiltro-marca-y-riesgo','Prefiltro de marca y riesgo','El filtro entre encontrar información y publicarla. Lo que nos puede costar un baneo.'],
 ['08-pipeline-y-agentes','Pipeline y agentes','Qué hace cada uno de los siete agentes y por qué el humano sigue en medio.'],
 ['09-herramientas-y-medicion','Herramientas y medición','Qué se puede automatizar hoy, qué cuesta, y qué está bloqueado por permisos de API.'],
 ['10-medicion-por-red','Medición por red','Cinco cosas que dimos por buenas y no lo eran. Si lees una sola sección, que sea esta.'],
 ['11-produccion-y-archivo','Producción y archivo','De la extracción al archivo final: cómo se produce una pieza de punta a punta.'],
 ['12-limites-de-ia-por-red','Límites de IA por red','Qué detecta cada plataforma, qué penaliza, y por qué los metadatos sí importan.'],
 ['13-seo-social-por-red','SEO social por red','Lo que la gente ya busca en Google decide qué publicamos.'],
 ['14-publicacion-automatica','Publicación automática','Se puede publicar solo en las cinco redes a costo cero, pero no por una sola vía.'],
 ['15-que-impulsa-tiktok','Qué impulsa TikTok','El tamaño de la cuenta no es el problema. TikTok lo dice literal.'],
 ['16-value-ladder','Value ladder','El marco del "valor antes del valor": qué se da gratis y en qué orden.'],
 ['17-comunidad-de-whatsapp','Comunidad de WhatsApp','Tres hallazgos que cambian el planteamiento del funnel.'],
 ['18-tendencias-al-dia','Tendencias al día','Automatizar la capa de Google y comprimir la captura manual a 15 minutos.'],
 ['19-newsletters','Newsletters','Cinco correos vivos, no diez. El eje es el día 17 y la métrica es el clic.'],
 ['20-seo-del-sitio','SEO del sitio','heru no tiene problema de rankings: posición 6.3 con CTR de 1.26%. El problema es otro.'],
 ['21-inspo-competencia','Inspo competencia','Los referentes de impuestos y finanzas en México, red por red, y qué se les puede replicar.'],
 ['22-branding-heru','Branding heru','La fuente de verdad de la marca, completa: paleta, tipografía, logo, formatos y prohibiciones.'],
 ['23-plan-de-ejecucion-diario','Plan de ejecución diario','Cómo el sistema decide cada día qué se publica, lo produce, lo revisa y aprende del resultado.'],
 ['24-parrilla-semanal','Parrilla semanal por red','Un tema fijo por día, de lunes a domingo, y qué le toca a cada red ese día.'],
 ['25-calendario-de-temporadas','Calendario de temporadas','Qué fechas del año merecen una pieza, cuáles no, y cómo se conecta una fecha cultural con un tema fiscal sin que se note forzado.']
];
const COMP=[['dem','demanda',30],['ven','ventana',25],['evi','evidencia',20],['enc','encaje',15],['wa','whatsapp',10]];

let DATOS=null, SEC='aprobar', RED='Todas';
let DOC=null, BUSCA='', CACHE={}, TODO=null;   // investigación

const cfgLeer=()=>{try{return JSON.parse(localStorage.getItem('heru_cfg')||'{}')}catch(e){return{}}};
const cfgGuardar=c=>{try{localStorage.setItem('heru_cfg',JSON.stringify(c))}catch(e){}};
const arteLeer=()=>{try{return JSON.parse(localStorage.getItem('heru_arte')||'{}')}catch(e){return{}}};
const arteGuardar=a=>{try{localStorage.setItem('heru_arte',JSON.stringify(a))}catch(e){}};
const aprLeer=()=>{try{return JSON.parse(localStorage.getItem('heru_aprob')||'{}')}catch(e){return{}}};
const aprGuardar=a=>{try{localStorage.setItem('heru_aprob',JSON.stringify(a))}catch(e){}};

async function cargar(){
  const cfg=cfgLeer(); let vivo=false, txt='';
  if(cfg.api){
    try{ const r=await fetch(cfg.api,{cache:'no-store'}); if(!r.ok) throw 0;
      DATOS=await r.json(); vivo=true; txt='en vivo · '+hora(DATOS.generado);
    }catch(e){ txt='no se pudo leer la API · '; }
  }
  if(!DATOS||!vivo){
    try{ const r=await fetch('datos.json',{cache:'no-store'}); DATOS=await r.json();

/* Un renderizador de markdown chico y propio. No traigo una librería
   de un CDN por dos razones: la página es autocontenida a propósito, y
   estos documentos solo usan encabezados, listas, tablas, citas y
   énfasis. Tablas incluidas, que aquí son la mitad del contenido. */
function md(src){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const linea=s=>esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|\s)(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');

  const ls=src.replace(/\r/g,'').split('\n');
  let h='', i=0, enCodigo=false, buf=[];
  // una lista numerada cortada por un párrafo se reabre más abajo: se guarda
  // el número con el que venía en el markdown para que no vuelva a empezar en 1
  const cerrarLista=()=>{ if(buf.length){
    const desde = buf.tipo==='ol' && buf.inicio>1 ? ` start="${buf.inicio}"` : '';
    h+=`<${buf.tipo}${desde}>`+buf.join('')+`</${buf.tipo}>`; buf=[]; } };

  while(i<ls.length){
    const l=ls[i];

    if(/^```/.test(l)){                       // bloque de código
      cerrarLista();
      if(!enCodigo){ enCodigo=true; h+='<pre><code>'; }
      else { enCodigo=false; h+='</code></pre>'; }
      i++; continue;
    }
    if(enCodigo){ h+=esc(l)+'\n'; i++; continue; }

    if(/^\|/.test(l) && /^\|[\s:|-]+\|?\s*$/.test(ls[i+1]||'')){   // tabla
      cerrarLista();
      const fila=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const cab=fila(l); i+=2;
      let cuerpo='';
      while(i<ls.length && /^\|/.test(ls[i])){
        cuerpo+='<tr>'+fila(ls[i]).map(c=>`<td>${linea(c)}</td>`).join('')+'</tr>'; i++;
      }
      h+=`<div class="tabla-wrap"><table><thead><tr>`
        +cab.map(c=>`<th>${linea(c)}</th>`).join('')+`</tr></thead><tbody>${cuerpo}</tbody></table></div>`;
      continue;
    }

    const enc=/^(#{1,4})\s+(.*)$/.exec(l);
    if(enc){ cerrarLista(); const n=Math.min(enc[1].length+1,5);
             h+=`<h${n}>${linea(enc[2])}</h${n}>`; i++; continue; }

    if(/^\s*([-*•])\s+/.test(l)){ if(buf.tipo!=='ul'){cerrarLista(); buf.tipo='ul';}
      buf.push(`<li>${linea(l.replace(/^\s*[-*•]\s+/,''))}</li>`); i++; continue; }
    const num=/^\s*(\d+)[.)]\s+/.exec(l);
    if(num){ if(buf.tipo!=='ol'){cerrarLista(); buf.tipo='ol'; buf.inicio=parseInt(num[1],10)||1;}
      buf.push(`<li>${linea(l.replace(/^\s*\d+[.)]\s+/,''))}</li>`); i++; continue; }

    if(/^>\s?/.test(l)){ cerrarLista(); h+=`<blockquote>${linea(l.replace(/^>\s?/,''))}</blockquote>`; i++; continue; }
    if(/^\s*(---|___|\*\*\*)\s*$/.test(l)){ cerrarLista(); h+='<hr>'; i++; continue; }
    if(!l.trim()){ cerrarLista(); i++; continue; }

    cerrarLista();
    let p=[l]; i++;
    while(i<ls.length && ls[i].trim() && !/^(#{1,4}\s|\||>|\s*[-*•]\s|\s*\d+[.)]\s|```)/.test(ls[i])){ p.push(ls[i]); i++; }
    h+=`<p>${linea(p.join(' '))}</p>`;
  }
  cerrarLista();
  return h;
}

async function traer(f){
  if(CACHE[f]) return CACHE[f];
  const r=await fetch(`investigacion/${f}.md`);
  if(!r.ok) throw new Error('no se pudo leer '+f);
  return CACHE[f]=await r.text();
}

const cajaBusca=()=>`<div class="busca"><input id="q" type="search" placeholder="Buscar en toda la investigación…" value="${esc(BUSCA)}"></div>`;

async function montarInvestigacion(){
  const q=document.getElementById('q');
  if(q){
    q.oninput=e=>{ clearTimeout(window._t);
      window._t=setTimeout(()=>{ BUSCA=e.target.value.trim(); pintar();
        const n=document.getElementById('q'); if(n){n.focus(); n.setSelectionRange(n.value.length,n.value.length);} },350); };
  }
  if(DOC){
    const c=document.getElementById('lee');
    // el H1 del documento se quita: el título ya está en la cabecera
    try{ c.innerHTML=md((await traer(DOC)).replace(/^#\s+.*\n/,'')); }
    catch(e){ c.innerHTML=`<div class="vacio"><strong>No se pudo abrir</strong>Revisa que la carpeta <code>investigacion</code> esté publicada.</div>`; }
    return;
  }
  if(BUSCA) mostrarBusqueda();
}

async function mostrarBusqueda(){
  const caja=document.getElementById('result'); if(!caja) return;
  if(!TODO) TODO=await Promise.all(DOCS.map(async d=>[d, await traer(d[0]).catch(()=>'')]));
  const t=BUSCA.toLowerCase();
  const hits=[];
  for(const [d,txt] of TODO){
    const low=txt.toLowerCase(); let p=low.indexOf(t), n=0;
    const frags=[];
    // el fragmento es vista previa, no markdown: se le quitan pipes de
    // tabla, asteriscos y almohadillas para que se lea como una frase
    const limpiar=s=>s.replace(/\s*\|\s*/g,' · ').replace(/[*#`]/g,'')
                      .replace(/\s{2,}/g,' ').trim();
    while(p>-1 && n<3){
      frags.push(esc(limpiar(txt.slice(Math.max(0,p-90),p+110))).replace(
        new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),m=>`<mark>${m}</mark>`));
      p=low.indexOf(t,p+t.length); n++;
    }
    if(frags.length) hits.push({d,frags,total:low.split(t).length-1});
  }
  caja.innerHTML = hits.length
    ? `<p class="h2sub">${hits.reduce((a,h)=>a+h.total,0)} coincidencias en ${hits.length} secciones</p>`
      +hits.map(h=>`<div class="hit"><button class="lnk" data-doc="${h.d[0]}">${esc(h.d[1])}</button>
        <span class="cnt">${h.total}</span>${h.frags.map(f=>`<p class="frag">…${f}…</p>`).join('')}</div>`).join('')
    : `<div class="vacio"><strong>Sin coincidencias</strong>Nada con “${esc(BUSCA)}” en las ${DOCS.length} secciones.</div>`;
}

document.addEventListener('click',async e=>{
  const s=e.target.closest('[data-sec]');
  if(s){SEC=s.dataset.sec; if(SEC!=='investigacion'){DOC=null;BUSCA='';} pintar(); window.scrollTo(0,0); return;}
  // atajo de la Parrilla al documento largo que la sustenta
  if(e.target.closest('[data-ir24]')){
    SEC='investigacion'; DOC='24-parrilla-semanal'; BUSCA='';
    pintar(); window.scrollTo(0,0); return;
  }
  const doc=e.target.closest('[data-doc]');
  if(doc){ DOC=doc.dataset.doc; pintar(); window.scrollTo(0,0); return; }
  if(e.target.id==='volver'){ DOC=null; pintar(); window.scrollTo(0,0); return; }
  const r=e.target.closest('[data-red]');   if(r){RED=r.dataset.red; pintar(); return;}
  const a=e.target.closest('[data-aprobar]');
  if(a){ const o=aprLeer(); o[a.dataset.aprobar]='aprobada'; aprGuardar(o);
         mandar({accion:'aprobacion',id:a.dataset.aprobar,decision:'aprobada'}); pintar(); return; }
  const d=e.target.closest('[data-desaprobar]');
  if(d){ const o=aprLeer(); delete o[d.dataset.desaprobar]; aprGuardar(o);
         mandar({accion:'aprobacion',id:d.dataset.desaprobar,decision:'revertida'}); pintar(); return; }
  const g=e.target.closest('[data-guardarte]');
  if(g){ const id=g.dataset.guardarte;
         const inp=document.querySelector(`[data-arte="${id}"]`);
         const o=arteLeer(); o[id]=inp.value.trim(); arteGuardar(o);
         mandar({accion:'arte',id,url:o[id]}); pintar(); return; }
  const c=e.target.closest('[data-copiar]');
  if(c){ const p=piezas().find(x=>x.id===c.dataset.copiar);
         const t=p.caption.texto+'\n\n'+p.caption.cierre+'\n\n'+p.caption.fuentes+'\n'+p.caption.hashtags;
         try{ await navigator.clipboard.writeText(t); c.textContent='Copiado'; }
         catch(err){ c.textContent='No se pudo copiar'; }
         setTimeout(()=>c.textContent='Copiar caption',2000); return; }
  if(e.target.id==='exportar') exportar();
});

async function mandar(payload){
  const cfg=cfgLeer(); if(!cfg.api) return;
  try{ await fetch(cfg.api,{method:'POST',mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({token:cfg.token||''},payload))}); }catch(e){}
}

function exportar(){
  const cols=['id','tema','fuente','keyword','pilar','audiencia','red','formato','carril',
    'hecho_citable','dem','ven','evi','enc','wa','score','bloqueo','estado'];
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const csv=[cols.map(q).join(',')].concat(
    poolVivo().sort((a,b)=>b.score-a.score).map(p=>cols.map(c=>q(p[c])).join(','))).join('\n');
  try{ navigator.clipboard.writeText(csv); }catch(e){}
  const b=document.getElementById('exportar');
  if(b){ b.textContent='Copiado al portapapeles'; setTimeout(()=>b.textContent='Exportar a CSV',2200); }
}
